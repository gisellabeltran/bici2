<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Bicicleta ESP32</title>

<style>

body{
margin:0;
overflow:hidden;
background:skyblue;
font-family:Arial;
text-align:center;
}

h1{
margin-top:20px;
font-size:50px;
}

#distancia{
font-size:45px;
font-weight:bold;
margin-top:20px;
}

.bici{
position:absolute;
font-size:120px;
bottom:180px;
left:40%;

animation:mover 2s infinite alternate;
}

@keyframes mover{

from{
transform:translateX(-20px);
}

to{
transform:translateX(20px);
}

}

.calle{
position:absolute;
bottom:0;
width:100%;
height:180px;
background:#444;
}

</style>
</head>

<body>

<h1>🚲 Bicicleta Inteligente ESP32</h1>

<div id="distancia">
Distancia: Cargando...
</div>

<div class="bici">
🚲
</div>

<div class="calle"></div>

<script>

const token = "d3a9d74a-5c26-492c-bdb1-896ea7030b8e";

async function obtenerDato(){

    try{

        const respuesta = await fetch(
            "https://api.tago.io/data?query=last_item",
            {
                method:"GET",
                headers:{
                    "Device-Token": token,
                    "Content-Type":"application/json"
                }
            }
        );

        const datos = await respuesta.json();

        console.log(datos);

        if(datos.result && datos.result.length > 0){

            let valor = datos.result[0].value;

            document.getElementById("distancia").innerHTML =
            "Distancia: " + valor + " cm";
        }

    }catch(error){

        console.log(error);

        document.getElementById("distancia").innerHTML =
        "Error al conectar";
    }
}

obtenerDato();

setInterval(obtenerDato,2000);

</script>

</body>
</html>
