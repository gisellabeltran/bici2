<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Bicicleta ESP32</title>

<style>

body{
margin:0;
overflow:hidden;
background:skyblue;
font-family:Arial;
text-align:center;
}

h1{
margin-top:20px;
font-size:50px;
}

#distancia{
font-size:45px;
font-weight:bold;
margin-top:20px;
}

/* Bicicleta */

.bici{
position:absolute;
font-size:120px;
bottom:180px;
left:0;

animation:mover 8s linear infinite;
}

@keyframes mover{

0%{
left:5%;
}

100%{
left:80%;
}

}

/* Calle */

.calle{
position:absolute;
bottom:0;
width:100%;
height:180px;
background:#444;
}

/* Semáforos */

.semaforo{
position:absolute;
bottom:180px;
width:60px;
height:170px;
background:#222;
border-radius:10px;
padding:10px;
}

.luz{
width:40px;
height:40px;
border-radius:50%;
background:#555;
margin:10px auto;
}

/* Semáforo izquierda */

#sem1{
left:50px;
}

/* Semáforo derecha */

#sem2{
right:50px;
}

</style>
</head>

<body>

<h1>🚲 Bicicleta Inteligente ESP32</h1>

<div id="distancia">
Distancia: Cargando...
</div>

<!-- Bicicleta -->
<div class="bici">
🚲
</div>

<!-- Semáforo izquierda -->
<div class="semaforo" id="sem1">

<div class="luz" id="rojo"></div>
<div class="luz" id="amarillo"></div>
<div class="luz" id="verde"></div>

</div>

<!-- Semáforo derecha -->
<div class="semaforo" id="sem2">

<div class="luz"></div>
<div class="luz"></div>
<div class="luz"></div>

</div>

<!-- Calle -->
<div class="calle"></div>

<script>

const token = "d3a9d74a-5c26-492c-bdb1-896ea7030b8e";

async function obtenerDato(){

    try{

        const respuesta = await fetch(
            "https://api.tago.io/data?query=last_item",
            {
                method:"GET",
                headers:{
                    "Device-Token": token,
                    "Content-Type":"application/json"
                }
            }
        );

        const datos = await respuesta.json();

        console.log(datos);

        if(datos.result && datos.result.length > 0){

            let valor = datos.result[0].value;

            document.getElementById("distancia").innerHTML =
            "Distancia: " + valor + " cm";

            // Apagar todas las luces primero

            document.getElementById("rojo").style.background="#555";
            document.getElementById("amarillo").style.background="#555";
            document.getElementById("verde").style.background="#555";

            // Cambiar según distancia

            if(valor < 10){

                document.getElementById("rojo").style.background="red";

            }else if(valor < 25){

                document.getElementById("amarillo").style.background="yellow";

            }else{

                document.getElementById("verde").style.background="lime";

            }

        }

    }catch(error){

        console.log(error);

        document.getElementById("distancia").innerHTML =
        "Error al conectar";
    }
}

obtenerDato();

setInterval(obtenerDato,2000);

</script>

</body>
</html>
